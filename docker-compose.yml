services:
  postgres:
    image: postgres:17-alpine
    container_name: studyai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyai}
      POSTGRES_USER: ${POSTGRES_USER:-studyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyai_secure_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyai} -d ${POSTGRES_DB:-studyai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyai_backend
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studyai}:${POSTGRES_PASSWORD:-studyai_secure_password}@postgres:5432/${POSTGRES_DB:-studyai}
      SECRET_KEY: ${SECRET_KEY:-gerar_chave_segura_com_openssl_rand_hex_32}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 25
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-pro}
    volumes:
      - pdf_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyai_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
  pdf_uploads:
