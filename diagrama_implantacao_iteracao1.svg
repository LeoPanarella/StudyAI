<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtros de Sombra Suave -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="nodeShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <!-- Marcadores de Conexão -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Cabeçalho do Diagrama -->
  <rect x="0" y="0" width="1100" height="70" fill="#1e293b"/>
  <text x="40" y="32" fill="#ffffff" font-size="18" font-weight="bold">StudyAI — Diagrama de Implantação (UML Deployment Diagram)</text>
  <text x="40" y="52" fill="#94a3b8" font-size="12">Fase de Construção • Iteração 1 • Arquitetura de Contêineres, Comunicação e Persistência</text>
  <rect x="940" y="20" width="120" height="30" rx="4" fill="#334155" stroke="#475569"/>
  <text x="1000" y="40" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">UML 2.5</text>

  <!-- =================================================================== -->
  <!-- NÓ 1: DISPOSITIVO DO CLIENTE (CLIENT TIER) -->
  <!-- =================================================================== -->
  <g transform="translate(40, 100)">
    <!-- Nó 3D -->
    <polygon points="0,15 15,0 240,0 240,310 225,325 0,325" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#nodeShadow)"/>
    <polygon points="225,15 240,0 240,310 225,325" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="0,15 15,0 240,0 225,15" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="15" width="225" height="310" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>

    <text x="112" y="42" fill="#0f172a" font-size="11" text-anchor="middle">«device»</text>
    <text x="112" y="58" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">:Estação de Trabalho / Mobile</text>
    <line x1="15" y1="68" x2="210" y2="68" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Ambiente de Execução -->
    <rect x="15" y="85" width="195" height="225" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="112" y="105" fill="#334155" font-size="10" text-anchor="middle">«execution environment»</text>
    <text x="112" y="120" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Navegador Web (Browser)</text>
    <text x="112" y="133" fill="#64748b" font-size="9" text-anchor="middle">HTML5 / JavaScript Engine</text>

    <!-- Artefato SPA -->
    <rect x="25" y="150" width="175" height="145" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="112" y="172" fill="#2563eb" font-size="10" text-anchor="middle">«artifact»</text>
    <text x="112" y="188" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">StudyAI SPA (React 18)</text>
    <text x="112" y="202" fill="#64748b" font-size="9" text-anchor="middle">TypeScript + Vite Bundle</text>

    <line x1="35" y1="212" x2="190" y2="212" stroke="#e2e8f0" stroke-width="1"/>
    <text x="35" y="228" fill="#334155" font-size="9">• Gerenciamento de Rotas (SPA)</text>
    <text x="35" y="244" fill="#334155" font-size="9">• Revisor SM-2 &amp; Flip Card 3D</text>
    <text x="35" y="260" fill="#334155" font-size="9">• Visualizador de Conexões</text>
    <text x="35" y="276" fill="#334155" font-size="9">• Modo Escuro (Obsidian Theme)</text>
  </g>

  <!-- =================================================================== -->
  <!-- NÓ 2: SERVIDOR HOST DOCKER (APPLICATION HOST TIER) -->
  <!-- =================================================================== -->
  <g transform="translate(350, 100)">
    <!-- Fronteira do Host do Servidor -->
    <polygon points="0,15 15,0 710,0 710,630 695,645 0,645" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#nodeShadow)"/>
    <polygon points="695,15 710,0 710,630 695,645" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
    <polygon points="0,15 15,0 710,0 695,15" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
    <rect x="0" y="15" width="695" height="630" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>

    <text x="347" y="42" fill="#0f172a" font-size="12" text-anchor="middle">«node / server»</text>
    <text x="347" y="60" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">Servidor de Produção / VPS (Linux Ubuntu Server)</text>
    <text x="347" y="75" fill="#64748b" font-size="10" text-anchor="middle">Docker Engine &amp; Docker Compose Orchestrator</text>
    <line x1="20" y1="85" x2="675" y2="85" stroke="#cbd5e1" stroke-width="1"/>

    <!-- CONTÊINER 1: FRONTEND / NGINX -->
    <g transform="translate(25, 100)">
      <rect x="0" y="0" width="200" height="260" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="0" y="0" width="200" height="32" rx="6" fill="#0ea5e9"/>
      <rect x="0" y="20" width="200" height="12" fill="#0ea5e9"/>
      <text x="100" y="21" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«container» studyai_frontend</text>

      <text x="100" y="52" fill="#475569" font-size="10" text-anchor="middle">Nginx 1.25 Alpine</text>
      <text x="100" y="66" fill="#0369a1" font-size="10" font-weight="bold" text-anchor="middle">Porta 80 (HTTP / HTTPS)</text>
      <line x1="15" y1="76" x2="185" y2="76" stroke="#e0f2fe" stroke-width="1"/>

      <!-- Artefatos Nginx -->
      <rect x="12" y="88" width="176" height="65" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="20" y="105" fill="#0369a1" font-size="10" font-weight="bold">«artifact» /dist (Static Files)</text>
      <text x="20" y="122" fill="#334155" font-size="9">• index.html, JS, CSS Assets</text>
      <text x="20" y="137" fill="#334155" font-size="9">• SPA Fallback (try_files)</text>

      <rect x="12" y="165" width="176" height="80" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="20" y="182" fill="#0369a1" font-size="10" font-weight="bold">«artifact» nginx.conf</text>
      <text x="20" y="198" fill="#334155" font-size="9">• Reverse Proxy: /api/*</text>
      <text x="20" y="213" fill="#334155" font-size="9">• Header Forwarding</text>
      <text x="20" y="228" fill="#334155" font-size="9">• Gzip Compression</text>
    </g>

    <!-- CONTÊINER 2: BACKEND / FASTAPI -->
    <g transform="translate(255, 100)">
      <rect x="0" y="0" width="415" height="260" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="0" y="0" width="415" height="32" rx="6" fill="#6366f1"/>
      <rect x="0" y="20" width="415" height="12" fill="#6366f1"/>
      <text x="207" y="21" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«container» studyai_backend</text>

      <text x="207" y="52" fill="#475569" font-size="10" text-anchor="middle">Python 3.13 Runtime • Uvicorn ASGI Server</text>
      <text x="207" y="66" fill="#4338ca" font-size="10" font-weight="bold" text-anchor="middle">Porta Interna 8000</text>
      <line x1="15" y1="76" x2="400" y2="76" stroke="#e0e7ff" stroke-width="1"/>

      <!-- Módulos e Artefatos do Backend -->
      <rect x="12" y="88" width="190" height="155" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="20" y="105" fill="#4338ca" font-size="10" font-weight="bold">«component» FastAPI App</text>
      <text x="20" y="122" fill="#334155" font-size="9">• Auth Router (JWT &amp; Cookie)</text>
      <text x="20" y="137" fill="#334155" font-size="9">• Materials Router (Uploads)</text>
      <text x="20" y="152" fill="#334155" font-size="9">• Flashcards Router (SM-2)</text>
      <text x="20" y="167" fill="#334155" font-size="9">• Connections Router (Grafo)</text>
      <text x="20" y="182" fill="#334155" font-size="9">• Rate Limiter (Brute-force)</text>
      <text x="20" y="197" fill="#334155" font-size="9">• Pydantic Validation v2</text>
      <text x="20" y="212" fill="#334155" font-size="9">• Magic Bytes Validator</text>

      <rect x="212" y="88" width="190" height="155" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="220" y="105" fill="#4338ca" font-size="10" font-weight="bold">«services &amp; jobs»</text>
      <text x="220" y="122" fill="#334155" font-size="9">• PyMuPDF Extractor (fitz)</text>
      <text x="220" y="137" fill="#334155" font-size="9">• Job Worker (Async AI Queue)</text>
      <text x="220" y="152" fill="#334155" font-size="9">• Gemini Client + Retry Fallback</text>
      <text x="220" y="167" fill="#334155" font-size="9">• SM-2 Engine Calculator</text>
      <text x="220" y="182" fill="#334155" font-size="9">• Chunk Ranker (Focus Filter)</text>
      <text x="220" y="197" fill="#334155" font-size="9">• SQLAlchemy 2.0 ORM</text>
      <text x="220" y="212" fill="#334155" font-size="9">• Alembic Migrations</text>
    </g>

    <!-- CONTÊINER 3: BANCO DE DADOS POSTGRESQL -->
    <g transform="translate(255, 395)">
      <rect x="0" y="0" width="415" height="215" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.4" filter="url(#shadow)"/>
      <rect x="0" y="0" width="415" height="32" rx="6" fill="#059669"/>
      <rect x="0" y="20" width="415" height="12" fill="#059669"/>
      <text x="207" y="21" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«container» studyai_postgres</text>

      <text x="207" y="52" fill="#475569" font-size="10" text-anchor="middle">PostgreSQL 17 DBMS Alpine</text>
      <text x="207" y="66" fill="#047857" font-size="10" font-weight="bold" text-anchor="middle">Porta Interna 5432 (TCP/IP)</text>
      <line x1="15" y1="76" x2="400" y2="76" stroke="#d1fae5" stroke-width="1"/>

      <!-- Schemas do Banco -->
      <rect x="12" y="88" width="190" height="115" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="20" y="105" fill="#047857" font-size="10" font-weight="bold">«database» studyai_db</text>
      <text x="20" y="122" fill="#334155" font-size="9">• users (Auth &amp; Credenciais)</text>
      <text x="20" y="137" fill="#334155" font-size="9">• materials (PDF Text &amp; Meta)</text>
      <text x="20" y="152" fill="#334155" font-size="9">• summaries (AI Synthesis)</text>
      <text x="20" y="167" fill="#334155" font-size="9">• flashcards (SM-2 Repetition)</text>
      <text x="20" y="182" fill="#334155" font-size="9">• material_connections (Graph)</text>

      <!-- Volume Persistente PG DATA -->
      <rect x="212" y="88" width="190" height="115" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="220" y="105" fill="#047857" font-size="10" font-weight="bold">«storage volume» pg_data</text>
      <text x="220" y="122" fill="#334155" font-size="9">• /var/lib/postgresql/data</text>
      <text x="220" y="137" fill="#334155" font-size="9">• Persistência de Dados ACID</text>
      <text x="220" y="152" fill="#334155" font-size="9">• Sobrevive a Restart/Update</text>
      <text x="220" y="167" fill="#334155" font-size="9">• Backups SQL Automatizados</text>
      <text x="220" y="182" fill="#334155" font-size="9">• Chaves ON DELETE CASCADE</text>
    </g>

    <!-- VOLUME PERSISTENTE PDFS -->
    <g transform="translate(25, 410)">
      <rect x="0" y="0" width="200" height="195" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
      <text x="100" y="25" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">«storage volume»</text>
      <text x="100" y="42" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">pdf_uploads</text>
      <line x1="15" y1="52" x2="185" y2="52" stroke="#fde68a" stroke-width="1"/>
      <text x="20" y="72" fill="#451a03" font-size="9" font-weight="bold">Mapeamento em Disco:</text>
      <text x="20" y="88" fill="#78350f" font-size="9">• Host: docker volume</text>
      <text x="20" y="104" fill="#78350f" font-size="9">• Container: /app/uploads</text>
      <text x="20" y="120" fill="#78350f" font-size="9">• Particionamento por User ID:</text>
      <text x="25" y="135" fill="#78350f" font-size="8.5">/uploads/{user_id}/{uuid}.pdf</text>
      <text x="20" y="155" fill="#78350f" font-size="9">• Isolamento de permissões</text>
      <text x="20" y="172" fill="#78350f" font-size="9">• Limite de 25 MB por PDF</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- NÓ 3: SERVIÇO EM NUVEM EXTERNO (CLOUD AI TIER) -->
  <!-- =================================================================== -->
  <g transform="translate(40, 480)">
    <polygon points="0,15 15,0 240,0 240,240 225,255 0,255" fill="#f8fafc" stroke="#9333ea" stroke-width="1.5" filter="url(#nodeShadow)"/>
    <polygon points="225,15 240,0 240,240 225,255" fill="#e2e8f0" stroke="#9333ea" stroke-width="1.5"/>
    <polygon points="0,15 15,0 240,0 225,15" fill="#cbd5e1" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="0" y="15" width="225" height="240" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>

    <text x="112" y="42" fill="#9333ea" font-size="10" text-anchor="middle">«cloud service / external»</text>
    <text x="112" y="58" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Google Gemini AI</text>
    <line x1="15" y1="68" x2="210" y2="68" stroke="#f3e8ff" stroke-width="1"/>

    <rect x="15" y="80" width="195" height="155" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="25" y="100" fill="#7e22ce" font-size="10" font-weight="bold">Modelos Operacionais:</text>
    <text x="25" y="118" fill="#334155" font-size="9">• gemini-2.5-flash (Principal)</text>
    <text x="25" y="133" fill="#334155" font-size="9">• gemini-2.0-flash (Fallback 1)</text>
    <text x="25" y="148" fill="#334155" font-size="9">• gemini-1.5-flash (Fallback 2)</text>
    <text x="25" y="163" fill="#334155" font-size="9">• gemini-1.5-pro (Fallback 3)</text>
    <line x1="25" y1="173" x2="195" y2="173" stroke="#e9d5ff" stroke-width="1"/>
    <text x="25" y="190" fill="#6b21a8" font-size="8.5"><b>Protocolo:</b> HTTPS / REST API</text>
    <text x="25" y="205" fill="#6b21a8" font-size="8.5"><b>Autenticação:</b> GEMINI_API_KEY</text>
    <text x="25" y="220" fill="#6b21a8" font-size="8.5"><b>Controle:</b> Backoff Exponencial</text>
  </g>

  <!-- =================================================================== -->
  <!-- LINHAS DE CONEXÃO & PROTOCOLOS (COMMUNICATION PATHS) -->
  <!-- =================================================================== -->

  <!-- 1. Cliente -> Frontend (HTTP / HTTPS 80/443) -->
  <path d="M 265 240 L 375 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="272" y="215" width="95" height="20" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="229" fill="#1e40af" font-size="8.5" font-weight="bold" text-anchor="middle">HTTPS (80/443)</text>

  <!-- 2. Frontend Nginx -> Backend FastAPI (/api/* proxy) -->
  <path d="M 575 230 L 605 230" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="200" width="70" height="22" rx="3" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="595" y="214" fill="#0369a1" font-size="8" font-weight="bold" text-anchor="middle">proxy /api/*</text>
  <text x="595" y="228" fill="#0369a1" font-size="7.5" text-anchor="middle">TCP 8000</text>

  <!-- 3. Backend -> Postgres (SQLAlchemy / TCP 5432) -->
  <path d="M 812 360 L 812 395" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="818" y="365" width="115" height="22" rx="3" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="875" y="377" fill="#047857" font-size="8" font-weight="bold" text-anchor="middle">psycopg3 (TCP 5432)</text>
  <text x="875" y="388" fill="#047857" font-size="7.5" text-anchor="middle">DATABASE_URL (ACID)</text>

  <!-- 4. Backend -> Volume pdf_uploads -->
  <path d="M 605 320 L 585 320 L 585 507 L 575 507" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="525" y="370" width="65" height="20" rx="3" fill="#fffbeb" stroke="#fde68a"/>
  <text x="557" y="383" fill="#92400e" font-size="7.5" font-weight="bold" text-anchor="middle">mount fs</text>

  <!-- 5. Backend -> Google Gemini (HTTPS 443 Externo) -->
  <path d="M 605 280 L 290 280 L 290 580 L 265 580" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="298" y="420" width="105" height="24" rx="3" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="350" y="433" fill="#7e22ce" font-size="8" font-weight="bold" text-anchor="middle">HTTPS REST (443)</text>
  <text x="350" y="445" fill="#7e22ce" font-size="7.5" text-anchor="middle">API Key Auth</text>

</svg>
